<title>カレーのゆくえ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#ffffff;--ink:#222;--sub:#5a5048;--acc:#d6452c;--G:#3f9153;--P:#7b52a8;--O:#e2822a;--W:#2b6cd4;--pane:#f6f2ea}


*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;background:white;color:#222;padding:12px 16px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:18px;text-align:center;border-bottom:2px solid #222;padding-bottom:6px;margin-bottom:8px;letter-spacing:.06em}
.meta{text-align:center;font-size:12px;color:#555;margin-bottom:10px}
svg{display:block;width:100%;height:auto}
.card{fill:white;stroke:#111;stroke-width:3}
.ct{font-weight:900;text-anchor:middle;dominant-baseline:central;letter-spacing:.02em}
.label-ex{font-size:12.5px;fill:#555;text-anchor:middle;dominant-baseline:central}
.criterion{font-size:13px;fill:#555;font-weight:bold;dominant-baseline:central}
.note{margin-top:8px;font-size:12px;color:#555;text-align:right}
@media print{body{padding:0} .wrap{max-width:none;width:270mm}}

body{background:var(--bg);color:var(--ink);padding-block:8px}
h1{margin-bottom:6px;padding-bottom:4px;font-size:16px}
.wrap{max-width:1100px}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid #e5ded2}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.pick{font-family:inherit;font-weight:900;font-size:15px;color:#fff;border:3px solid transparent;border-radius:999px;padding:6px 13px;cursor:pointer;transition:transform .08s}
.pick:active,.go:active,.sub:active{transform:translateY(4px)}
.pick[aria-pressed="true"]{border-color:#222}
.go{font-family:inherit;font-weight:900;font-size:18px;color:#fff;background:var(--acc);border:none;border-radius:999px;padding:8px 24px;cursor:pointer;transition:transform .08s}
.go:disabled{opacity:.4;cursor:default}
.sub{font-family:inherit;font-size:14px;color:var(--sub);background:var(--pane);border:none;border-radius:999px;padding:8px 14px;cursor:pointer}
.sub:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid #222;outline-offset:2px}
.cap{width:100%;max-width:960px;margin:0 auto;background:var(--pane);border-radius:14px;padding:10px 18px;font-size:20px;font-weight:700;text-align:center;text-wrap:balance;min-height:2.6em;display:flex;align-items:center;justify-content:center;gap:12px}
.cap .n{font-size:13px;color:var(--sub);white-space:nowrap}
#tok{transition:transform .6s cubic-bezier(.3,1.2,.5,1)}
.hlr{fill:none;stroke:#ffc61a;stroke-width:5;opacity:.95}
.note{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){#tok{transition:none}}
</style>

<script>
const COL=['#3f9153','#7b52a8','#e2822a','#2b6cd4'];
const TOPS=['炭水化物（デンプン）','タンパク質','脂肪'];
// [位置の目印にする文字（#2＝同じ文字の2つめ）, 'box'＝その箱の左どなり／'boxR'＝右どなり／'row'＝その段の高さで自分の列の線の上（＋横のずらし）, 横のずらし, 説明, 光らせるカード]
const STEPS=[
 [['炭水化物（デンプン）','box',0,'カレーのごはんには、デンプン（炭水化物）が多くふくまれる',['炭水化物（デンプン）']],
  ['アミラーゼ','row',-30,'口：だ液のアミラーゼで、デンプンが小さく分解される（麦芽糖など）',['口','だ液せん','だ液','アミラーゼ']],
  ['食道','row',-30,'食道：通りぬけて、胃へ送られる',['食道']],
  ['ペプシン','row',-30,'胃：胃液はデンプンにははたらかない。そのまま通る',['胃','胃液']],
  ['すい液','row',-30,'小腸：すい液の消化酵素で、さらに小さく分解される',['小腸','すい臓','すい液']],
  ['小腸のかべの消化酵素','row',-30,'小腸：小腸のかべの消化酵素で、ブドウ糖まで分解される',['小腸','小腸のかべの消化酵素']],
  ['ブドウ糖','box',0,'ブドウ糖になった',['ブドウ糖']],
  ['吸収','row',0,'小腸のかべの柔毛から吸収される',['吸収','柔毛']],
  ['毛細血管','box',0,'毛細血管に入る',['毛細血管']],
  ['肝臓#2','boxR',0,'肝臓へ。一部はグリコーゲンとして一時的にたくわえられる',['肝臓#2','グリコーゲン']],
  ['全身の細胞','box',0,'全身の細胞へ運ばれる',['全身の細胞']]],
 [['タンパク質','box',0,'カレーの肉には、タンパク質が多くふくまれる',['タンパク質']],
  ['アミラーゼ','row',-30,'口：だ液はタンパク質にははたらかない。そのまま通る',['口','だ液せん','だ液']],
  ['食道','row',-30,'食道：通りぬけて、胃へ送られる',['食道']],
  ['ペプシン','row',-30,'胃：胃液のペプシンで分解される',['胃','胃液','ペプシン']],
  ['トリプシン','row',-30,'小腸：すい液のトリプシンなどで、さらに分解される',['小腸','すい臓','すい液','トリプシン']],
  ['小腸のかべの消化酵素','row',-30,'小腸：小腸のかべの消化酵素で、アミノ酸まで分解される',['小腸','小腸のかべの消化酵素']],
  ['アミノ酸','box',0,'アミノ酸になった',['アミノ酸']],
  ['吸収','row',0,'小腸のかべの柔毛から吸収される',['吸収','柔毛']],
  ['毛細血管','box',0,'毛細血管に入る',['毛細血管']],
  ['肝臓#2','boxR',0,'肝臓へ。一部はタンパク質につくりかえられる',['肝臓#2']],
  ['全身の細胞','box',0,'全身の細胞へ運ばれる',['全身の細胞']]],
 [['脂肪','box',0,'カレーの油には、脂肪が多くふくまれる',['脂肪']],
  ['アミラーゼ','row',-30,'口：だ液は脂肪にははたらかない。そのまま通る',['口','だ液せん','だ液']],
  ['食道','row',-30,'食道：通りぬけて、胃へ送られる',['食道']],
  ['ペプシン','row',-30,'胃：胃液も脂肪にははたらかない。そのまま通る',['胃','胃液']],
  ['胆汁','row',-30,'小腸：肝臓でつくられ胆のうから出る胆汁が、脂肪の分解を助ける（胆汁に消化酵素はない）',['小腸','肝臓','胆のう','胆汁']],
  ['リパーゼ','row',-30,'小腸：すい液のリパーゼで、脂肪酸とモノグリセリドに分解される',['小腸','すい臓','すい液','リパーゼ']],
  ['脂肪酸','boxR',0,'脂肪酸とモノグリセリドになった',['脂肪酸','モノグリセリド']],
  ['吸収','row',0,'小腸のかべの柔毛から吸収される',['吸収','柔毛']],
  ['柔毛の中で再び','row',0,'柔毛の中で、再び脂肪になる',['脂肪#2']],
  ['リンパ管','box',0,'リンパ管に入る',['リンパ管']],
  ['血管（静脈）','box',0,'心臓の近くで、血管（静脈）に合流する',['血管（静脈）']],
  ['全身の細胞','box',0,'全身の細胞へ運ばれる',['全身の細胞']]],
 [['カレーライス','box',0,'カレーには、水分や、消化されない繊維などもふくまれる',['カレーライス']],
  ['口','box',0,'口から入る',['口']],
  ['食道','box',0,'食道を通る',['食道']],
  ['胃','box',0,'胃を通る',['胃']],
  ['小腸','box',0,'小腸：水分の多くは、ここで吸収される',['小腸','水分']],
  ['大腸','box',0,'大腸：残りの水分の一部が吸収される',['大腸']],
  ['肛門','box',0,'消化されなかった繊維などは、肛門から出される',['肛門']],
  ['便','box',0,'便になる',['便']]]];
const $=id=>document.getElementById(id);
const map=$('map'), VB=map.viewBox.baseVal, TX=[...map.querySelectorAll('text')], RC=[...map.querySelectorAll('rect.card')];
const findT=s=>{const m=s.replace(/^!/,'').split('#');return TX.filter(e=>e.textContent.trim()===m[0])[(+m[1]||1)-1];};
function boxOf(s){const t=findT(s); if(!t) return null; const b=t.getBBox(); if(s[0]==='!') return b; const cx=b.x+b.width/2, cy=b.y+b.height/2;
  let best=null,ba=1e12; RC.forEach(r=>{const q=r.getBBox(); if(q.x<=cx&&cx<=q.x+q.width&&q.y<=cy&&cy<=q.y+q.height&&q.width*q.height<ba){best=q;ba=q.width*q.height;}});
  return best||b;}
function colX(k){const t=findT(TOPS[k]); const b=t.getBBox(); return b.x+b.width/2;}
const POS=STEPS.map((st,k)=>st.map(s=>{const t=findT(s[0]);
  if(s[1]==='box'){const b=boxOf(s[0]); return [Math.max(b.x-24,VB.x+18)+s[2], b.y+b.height/2];}
  if(s[1]==='boxR'){const b=boxOf(s[0]); return [Math.min(b.x+b.width+24,VB.x+VB.width-18)+s[2], b.y+b.height/2];}
  const b=t.getBBox(); return [colX(k)+s[2], b.y+b.height/2];}));
const HL=STEPS.map(st=>st.map(s=>s[4].map(boxOf).filter(Boolean)));
let k=0,i=0;
function show(){const s=STEPS[k][i], p=POS[k][i];
  $('tok').style.transform=`translate(${p[0]}px,${p[1]}px)`;
  $('tokc').style.fill=COL[k];
  $('hl').innerHTML=HL[k][i].map(b=>`<rect class="hlr" x="${b.x-5}" y="${b.y-5}" width="${b.width+10}" height="${b.height+10}" rx="12"/>`).join('');
  $('capt').textContent=s[3];
  $('cnt').textContent=(i+1)+' / '+STEPS[k].length;
  $('go').disabled=i>=STEPS[k].length-1; $('back').disabled=i===0;
  follow(p[1]);}
// 印が画面の外に出そうなら、印が見える位置までページを動かす（説明文とボタンは上に固定）
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function follow(sy){const r=map.getBoundingClientRect(), y=r.top+sy*r.height/VB.height, hb=$('head').getBoundingClientRect().bottom;
  if(y<hb+70||y>innerHeight-70) window.scrollBy({top:y-(hb+(innerHeight-hb)/2),behavior:RM?'auto':'smooth'});}
function pick(n){k=n;i=0;[0,1,2,3].forEach(j=>$('p'+j).setAttribute('aria-pressed',j===n?'true':'false'));show();}
const next=()=>{if(i<STEPS[k].length-1){i++;show();}}, prev=()=>{if(i>0){i--;show();}};
[0,1,2,3].forEach(j=>$('p'+j).onclick=()=>pick(j));
$('go').onclick=next; $('back').onclick=prev; $('reset').onclick=()=>{i=0;show();};
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev();}
  else if(['1','2','3','4'].includes(e.key)){pick(+e.key-1);}
});
show();
</script>
